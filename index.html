<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoQ Subscriber</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>

<body>
  <main>
    <h1>MoQ Subscriber</h1>

    <form id="connect-form">
      <label>
        Relay URL
        <input id="relay-url" type="url" placeholder="https://relay.example.com/" required />
      </label>
      <label>
        Namespace
        <input id="namespace" type="text" placeholder="live/broadcast" required />
      </label>
      <label>
        Quality
        <select id="quality" disabled></select>
      </label>
      <button type="submit">Connect</button>
      <button type="button" id="disconnect" disabled>Disconnect</button>
      <button type="button" id="fullscreen">Fullscreen</button>
    </form>

    <p id="status">disconnected</p>
    <p id="stats"></p>

    <div id="player-container">
      <canvas id="canvas" width="1920" height="1080"></canvas>
      <video id="video" muted playsinline hidden></video>
    </div>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
